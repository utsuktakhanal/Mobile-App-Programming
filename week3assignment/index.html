<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Farvella</title>
    <link rel="stylesheet" href="/week3assignment/style.css" />
    <script src="https://ajax.googleapis.com/ajax/libs/jquery/3.7.1/jquery.min.js"></script>
  </head>

  <body>
    <nav class="navbar">
      <div class="logo">
        <img id="logo" src="/week3assignment/images/logo (2).png" alt="logo" />
      </div>

      <div class="hamburger" id="hamburger">
        <div></div>
        <div></div>
        <div></div>
      </div>

      <ul class="nav-links" id="nav-links">
        <li>Home</li>
        <li>Destinations</li>
        <li>Bookings</li>
        <li>Packages</li>
        <li>Profile</li>
      </ul>
    </nav>

    <section class="image-banner">
      <img src="/week3assignment/images/nepal.jpeg" alt="Nepal" />
      <div class="banner-text">Your world, your way</div>
    </section>
    <section class="section" id="exploreBox">
      <h2>Explore Top Destinations</h2>
      <div class="destinations">
        <div class="card" id="card1">
          <img
            src="/week3assignment/images/kathmandu-valley.avif"
            alt="Kathmandu"
          />
          <h3>Kathmandu</h3>
        </div>

        <div class="card" id="card2">
          <img src="/week3assignment/images/chitwan.jpg" alt="Chitwan" />
          <h3>Chitwan</h3>
        </div>

        <div class="card" id="card3">
          <img src="/week3assignment/images/pokhara.jpg" alt="Pokhara" />
          <h3>Pokhara</h3>
        </div>
      </div>
    </section>

    <section class="section box" id="animateBox">Explore Now</section>

    <footer>© 2025 TravelGo. All rights reserved.</footer>

    <script src="/week3assignment/myScript.js"></script>
  </body>
</html>
